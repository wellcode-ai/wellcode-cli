[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wellcode-cli"
version = "0.2.0"
description = "Open-source developer productivity platform — track engineering metrics, DORA, AI coding tools, and developer experience"
readme = "README.md"
authors = [{ name = "Wellcode AI", email = "hello@wellcode.ai" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyGithub>=1.55",
    "requests>=2.31.0",
    "urllib3>=2.0.7",
    "chardet>=5.2.0",
    "idna>=3.6",
    "certifi>=2023.7.22",
    "rich>=13.0.0",
    "rich-click>=1.6.0",
    "anthropic>=0.18.0",
    "python-dateutil>=2.8.2",
    "splitio-client>=9.2.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "pyperclip>=1.9.0",
    "prompt_toolkit>=3.0.48",
    "jira>=3.5.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "apscheduler>=3.10.0",
    "python-gitlab>=4.0.0",
    "atlassian-python-api>=3.41.0",
    "python-jose[cryptography]>=3.3.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.0",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/wellcode-ai/wellcode-cli"
Repository = "https://github.com/wellcode-ai/wellcode-cli"

[project.scripts]
wellcode = "wellcode_cli.main:main"
wellcode-cli = "wellcode_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wellcode_cli"]

[tool.hatch.build]
include = [
    "src/wellcode_cli/**/*.py",
    "src/wellcode_cli/**/*.html",
    "src/wellcode_cli/**/*.js",
    "src/wellcode_cli/**/*.css",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
